<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>coursework</title>
    <script>
      // Apply the saved theme and palette before the app mounts so the first paint is already right; App.tsx owns later changes.
      // Keep the palette ids in step with web/src/palette.ts (test/palette.test.ts checks this).
      try {
        var theme = localStorage.getItem('coursework.theme');
        var palette = localStorage.getItem('coursework.palette');
        document.documentElement.dataset.theme = theme === 'system' || theme === 'dark' ? theme : 'light';
        document.documentElement.dataset.palette = ['mono', 'mist', 'pine', 'stone', 'morty'].indexOf(palette) >= 0 ? palette : 'mono';
      } catch (error) { /* Storage may be blocked; the app falls back to its defaults. */ }
      // Background mode and card opacity (web/src/background.ts parses the same JSON; the image itself loads after mount).
      document.documentElement.dataset.bg = 'gradient';
      try {
        var background = JSON.parse(localStorage.getItem('coursework.background') || '{}') || {};
        if (['gradient', 'solid', 'image'].indexOf(background.mode) >= 0) document.documentElement.dataset.bg = background.mode;
        var card = typeof background.cardOpacity === 'number' ? Math.min(100, Math.max(70, Math.round(background.cardOpacity))) : 94;
        if (background.mode === 'image') {
          document.documentElement.style.setProperty('--surface-alpha', card + '%');
          if (card < 100) document.documentElement.dataset.glass = '';
        }
      } catch (error) { /* Malformed settings fall back to the gradient. */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
