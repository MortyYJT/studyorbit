<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>StudyOrbit</title>
    <!-- Tab icon (the header mark redrawn for 16px); the 32px PNG is for browsers without SVG favicons
         (SVG last so browsers that support it pick it). -->
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the saved theme before the app mounts so the first paint is already right; App.tsx owns later changes.
      // The `coursework.` fallbacks cover the first load after the key rename; main.tsx then moves those keys (storage-prefix.ts).
      // Theme: the same rule as resolveTheme in web/src/theme.ts (test/theme.test.ts runs this script against it). Only a
      // pick made in Settings is stored (`studyorbit.theme.v2`); a `light` under the older keys was the old default.
      try {
        var choice = localStorage.getItem('studyorbit.theme.v2');
        var previous = localStorage.getItem('studyorbit.theme');
        if (previous === null) previous = localStorage.getItem('coursework.theme');
        document.documentElement.dataset.theme = choice === 'system' || choice === 'light' || choice === 'dark' ? choice : previous === 'dark' ? 'dark' : 'system';
      } catch (error) { /* Storage may be blocked; the app falls back to its defaults. */ }
      // Background mode and card opacity (web/src/background.ts parses the same JSON; the image itself loads after mount).
      document.documentElement.dataset.bg = 'solid';
      try {
        var background = JSON.parse(localStorage.getItem('studyorbit.background') || localStorage.getItem('coursework.background') || '{}') || {};
        if (['solid', 'tint', 'image'].indexOf(background.mode) >= 0) document.documentElement.dataset.bg = background.mode;
        var card = typeof background.cardOpacity === 'number' ? Math.min(100, Math.max(70, Math.round(background.cardOpacity))) : 94;
        if (background.mode === 'image') {
          document.documentElement.style.setProperty('--surface-alpha', card + '%');
          if (card < 100) document.documentElement.dataset.glass = '';
        }
      } catch (error) { /* Malformed settings fall back to the flat background. */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
