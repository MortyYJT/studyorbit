<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>coursework 原型</title>
<!--
  Static UI prototype for `coursework ui`, following the PRD (note/product/prd.md)
  and frontend decisions #134-#140: left nav, main area, resident agent chat on the right.
  Pages: this week (home, with a month view), courses (course -> assessment),
  revision, settings & status. All data is synthetic. No network access, no dependencies.
-->
<style>
  :root {
    --bg: #fafafa; --panel: #ffffff; --text: #0a0a0a; --muted: #6b6b6b; --faint: #a3a3a3;
    --line: #e7e7e7; --hover: #f2f2f2; --ink: #0a0a0a; --on-ink: #ffffff;
    --alert: #d9480f; --alert-bg: #fff4ed; --lost: #c9c9c9;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    --radius: 12px; --ease: cubic-bezier(.2,.8,.2,1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0b0b; --panel: #141414; --text: #f2f2f2; --muted: #9a9a9a; --faint: #5c5c5c;
      --line: #262626; --hover: #1c1c1c; --ink: #f2f2f2; --on-ink: #0b0b0b;
      --alert: #ff8a4c; --alert-bg: #2a1609; --lost: #4a4a4a;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0b0b; --panel: #141414; --text: #f2f2f2; --muted: #9a9a9a; --faint: #5c5c5c;
    --line: #262626; --hover: #1c1c1c; --ink: #f2f2f2; --on-ink: #0b0b0b;
    --alert: #ff8a4c; --alert-bg: #2a1609; --lost: #4a4a4a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; transition: background .3s var(--ease), color .3s var(--ease); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
  .sub { font-size: 12px; color: var(--muted); }
  .num-t { font-variant-numeric: tabular-nums; }

  /* ---------- App shell: nav | main | chat ---------- */
  .app { display: grid; grid-template-columns: 200px minmax(0, 1fr) 360px; height: 100vh; }
  .app.chat-off { grid-template-columns: 200px minmax(0, 1fr) 0; }
  .app.chat-off .chat { display: none; }
  nav.side { border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; background: var(--panel); }
  .brand { font-weight: 700; letter-spacing: -.02em; font-size: 16px; display: flex; align-items: center; gap: 8px; padding: 4px 10px 16px; }
  .brand .dot { width: 10px; height: 10px; background: var(--ink); border-radius: 3px; transform: rotate(45deg); }
  .navbtn { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 8px 10px; border-radius: 8px; text-align: left; color: var(--muted); transition: background .2s, color .2s; }
  .navbtn:hover { background: var(--hover); color: var(--text); }
  .navbtn[aria-current="page"] { background: var(--ink); color: var(--on-ink); }
  .navbtn .g { width: 16px; text-align: center; }
  .navbtn .badge { margin-left: auto; min-width: 18px; height: 18px; border-radius: 9px; background: var(--alert); color: #fff; font-size: 11px; display: grid; place-items: center; padding: 0 5px; }
  .side .foot { margin-top: auto; padding: 10px; border-top: 1px solid var(--line); display: grid; gap: 4px; }
  .dotline { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .sdot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); flex: none; }
  .sdot.bad { background: var(--alert); }

  main { overflow: auto; padding: 20px 28px 48px; }
  .ph { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .ph h1 { font-size: 20px; margin: 0; letter-spacing: -.02em; }
  .ph .spacer { flex: 1; }
  .view { animation: viewIn .4s var(--ease); }
  @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .icon-btn { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .icon-btn:hover { background: var(--hover); }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 6px 14px; transition: background .2s, transform .15s var(--ease); }
  .btn:hover { background: var(--hover); }
  .btn:active { transform: scale(.97); }
  .btn.ink { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .btn.alert { background: var(--alert); color: #fff; border-color: var(--alert); }
  .btn.sm { padding: 3px 10px; font-size: 12px; border-radius: 8px; }
  .seg { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .seg button { border: 0; background: none; padding: 4px 12px; border-radius: 7px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
  .pill { font-size: 11px; padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); white-space: nowrap; }
  .pill.ink { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .pill.lock { border-style: dashed; }
  .sect { margin-top: 24px; }
  .sect > h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }

  /* ---------- Attention box (the only accent colour, #140) ---------- */
  .attn { border: 1px solid var(--alert); background: var(--alert-bg); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 8px; }
  .attn h3 { margin: 0; font-size: 13px; color: var(--alert); }
  .attn .it { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .attn .it span { flex: 1; min-width: 200px; }

  /* ---------- Week plan ---------- */
  .days { display: grid; gap: 10px; margin-top: 16px; }
  .day { padding: 12px 14px; display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 14px; }
  .day.today { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  .day.past { opacity: .65; }
  .dh2 b { display: block; font-size: 15px; }
  .cap { height: 4px; background: var(--line); border-radius: 9px; overflow: hidden; margin: 6px 0 2px; }
  .cap i { display: block; height: 100%; background: var(--ink); }
  .items { display: grid; gap: 2px; }
  .item { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 4px; border-radius: 8px; border: 0; background: none; text-align: left; width: 100%; }
  .item:hover { background: var(--hover); }
  .item .ck { width: 14px; height: 14px; border: 1.5px solid var(--faint); border-radius: 4px; }
  .item.done .ck { background: var(--ink); border-color: var(--ink); }
  .item.done .tt { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
  .item .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .ext { font-size: 10px; border: 1px dashed var(--faint); border-radius: 4px; padding: 0 4px; margin-right: 6px; color: var(--muted); }
  .item .wait { color: var(--alert); font-size: 11px; margin-left: 6px; }
  .overflow { padding: 12px 14px; border-style: dashed; }

  /* ---------- Month (kept from the previous prototype) ---------- */
  .month { display: grid; grid-template-columns: 46px repeat(7, minmax(0, 1fr)); }
  .month .dow { padding: 8px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .wk { padding: 8px 4px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); font-size: 12px; text-align: center; font-weight: 600; }
  .wk.break { color: var(--muted); font-weight: 400; }
  .cell { min-height: 96px; padding: 5px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); min-width: 0; }
  .cell:nth-child(8n) { border-right: 0; }
  .cell.out .num { color: var(--faint); }
  .num { font-size: 12px; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; margin-bottom: 3px; font-variant-numeric: tabular-nums; }
  .cell.today .num { background: var(--ink); color: var(--on-ink); font-weight: 700; }
  .ev { display: block; width: 100%; font-size: 11px; padding: 2px 6px; margin-bottom: 3px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev.due { background: var(--ink); color: var(--on-ink); border-color: var(--ink); font-weight: 600; }

  /* ---------- Rings ---------- */
  .ring { width: 44px; height: 44px; flex: none; }
  .ring circle { fill: none; stroke-width: 4; }
  .ring .bg { stroke: var(--line); }
  .ring .fg { stroke: var(--ink); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .9s var(--ease); }
  .donut-wrap { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 24px; align-items: center; padding: 18px; }
  .donut { width: 200px; height: 200px; }
  .donut path { fill: none; stroke-width: 18; }
  .donut .earned { stroke: var(--ink); }
  .donut .lost { stroke: var(--lost); }
  .donut .pend { stroke: var(--line); }
  .donut .unk { stroke: var(--faint); stroke-width: 2; stroke-dasharray: 3 4; }
  .donut text { fill: var(--text); text-anchor: middle; }
  .legend { display: grid; gap: 6px; font-size: 13px; }
  .legend .lr { display: grid; grid-template-columns: 12px minmax(0, 1fr) 54px 60px; gap: 10px; align-items: center; }
  .legend .sw { width: 12px; height: 12px; border-radius: 3px; background: var(--line); }
  .legend .sw.full { background: var(--ink); }
  .legend .sw.part { background: linear-gradient(90deg, var(--ink) 50%, var(--lost) 50%); }
  .legend .sw.unk { background: none; border: 1.5px dashed var(--faint); }
  .key { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 11px; color: var(--muted); }
  .key i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

  /* ---------- Courses ---------- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .tile { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 14px; display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; transition: transform .2s var(--ease), box-shadow .2s; }
  .tile:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .tile b { display: block; }
  .crumbs { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 10px; flex-wrap: wrap; }
  .crumbs button { border: 0; background: none; padding: 2px 4px; border-radius: 6px; color: var(--muted); }
  .crumbs button:hover { color: var(--text); background: var(--hover); }
  .policy { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; padding: 12px 14px; }
  .policy label { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  select.lv, .policy select { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 2px 6px; font-size: 12px; }
  .switch { width: 34px; height: 20px; border-radius: 10px; background: var(--line); border: 0; position: relative; padding: 0; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--panel); transition: transform .2s var(--ease); box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch[aria-checked="true"] { background: var(--ink); }
  .switch[aria-checked="true"]::after { transform: translateX(14px); }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .stat { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .stat .v { font-size: 22px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 12px; color: var(--muted); }
  .stat select { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 1px 4px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  td input.sc { width: 58px; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 3px 6px; font-variant-numeric: tabular-nums; }
  .kind { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
  .kind.work { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .kind.exam { border: 1.5px solid var(--ink); font-weight: 700; }
  .hurdle { font-size: 10px; margin-left: 6px; padding: 0 5px; border: 1px dashed var(--faint); border-radius: 4px; color: var(--muted); }
  .linklike { border: 0; background: none; padding: 0; text-align: left; text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
  .unknown { color: var(--muted); font-style: italic; }

  /* Source markers (#138) */
  .srcm { font-size: 11px; color: var(--muted); border: 0; background: none; padding: 0 2px; white-space: nowrap; }
  button.srcm { text-decoration: underline dotted; text-underline-offset: 3px; }
  button.srcm:hover { color: var(--text); }
  .fields { display: grid; }
  .field { display: grid; grid-template-columns: 90px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 4px; border-bottom: 1px solid var(--line); }
  .field .k { color: var(--muted); font-size: 13px; }
  .field input { border: 1px solid var(--ink); background: var(--bg); border-radius: 6px; padding: 3px 8px; width: 140px; }
  .cite { grid-column: 1 / -1; margin: 2px 0 4px; padding: 10px 12px; border-left: 2px solid var(--ink); background: var(--hover); border-radius: 0 8px 8px 0; font-size: 13px; animation: viewIn .25s var(--ease); }
  .cite .src { font-size: 11px; color: var(--muted); margin-top: 6px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .cite a { color: var(--text); }

  /* ---------- Revision ---------- */
  .notes { display: grid; gap: 2px; }
  .note-row { display: flex; justify-content: space-between; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--line); }
  .qstats { display: flex; gap: 22px; align-items: baseline; flex-wrap: wrap; margin: 6px 0 12px; }
  .qstats b { font-size: 22px; letter-spacing: -.02em; }

  /* ---------- Settings ---------- */
  .row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-top: 1px solid var(--line); gap: 12px; flex-wrap: wrap; }
  .row:first-child { border-top: 0; }
  .avail { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
  .avail label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); text-align: center; }
  .avail input { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px; text-align: center; font-variant-numeric: tabular-nums; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .kpi { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .kpi .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 12px; color: var(--muted); }
  .bars .br { display: grid; grid-template-columns: 150px 1fr; gap: 10px; align-items: center; font-size: 12px; margin-bottom: 8px; }
  .bars .pair { display: grid; gap: 3px; }
  .bars i { display: block; height: 6px; border-radius: 3px; }
  .bars i.est { background: var(--faint); }
  .bars i.act { background: var(--ink); }
  .pad { padding: 14px 16px; }

  /* ---------- Chat (#134, #137) ---------- */
  .chat { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .chat-h { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .chat-h b { flex: 1; }
  .ctx { margin: 10px 14px 0; font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .ctx span { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--text); }
  .msgs { flex: 1; overflow: auto; padding: 12px 14px; display: grid; gap: 10px; align-content: start; }
  .msg { max-width: 92%; padding: 8px 11px; border-radius: 12px; font-size: 13px; white-space: pre-wrap; animation: viewIn .25s var(--ease); }
  .msg.me { justify-self: end; background: var(--ink); color: var(--on-ink); border-bottom-right-radius: 4px; }
  .msg.ag { justify-self: start; background: var(--hover); border-bottom-left-radius: 4px; }
  .run { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13px; display: grid; gap: 6px; animation: viewIn .25s var(--ease); }
  .run .rh { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-weight: 600; }
  .run .rh button { font-weight: 400; }
  .step { display: grid; grid-template-columns: 16px 1fr auto; gap: 6px; align-items: center; color: var(--muted); }
  .step.ok { color: var(--text); }
  .step .shot { border: 0; background: none; padding: 0; font-size: 11px; color: var(--muted); text-decoration: underline; }
  .shotbox { grid-column: 1 / -1; height: 90px; border: 1px dashed var(--faint); border-radius: 8px; display: grid; place-items: center; font-size: 11px; color: var(--muted); }
  .confirm { border: 1.5px solid var(--alert); border-radius: 10px; padding: 10px; display: grid; gap: 8px; background: var(--alert-bg); }
  .confirm h4 { margin: 0; font-size: 12px; color: var(--alert); }
  .answers { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12px; }
  .answers b { font-variant-numeric: tabular-nums; }
  .chat-in { border-top: 1px solid var(--line); padding: 10px 12px; display: flex; gap: 8px; }
  .chat-in textarea { flex: 1; resize: none; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 10px; height: 40px; }
  .chat-in textarea:focus { outline: none; border-color: var(--ink); }
  .fab { position: fixed; right: 16px; bottom: 16px; z-index: 30; display: none; box-shadow: var(--shadow); }
  .app.chat-off .fab { display: block; }

  /* ---------- Modal ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.28); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 40; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .modal { position: fixed; left: 50%; top: 50%; width: min(480px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); z-index: 50;
    transform: translate(-50%, -46%) scale(.97); opacity: 0; pointer-events: none; transition: opacity .2s, transform .25s var(--ease); }
  .modal.on { opacity: 1; transform: translate(-50%, -50%); pointer-events: auto; }
  .modal .mh { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .modal .mh h2 { margin: 0; font-size: 16px; }
  .modal .mb { padding: 16px 18px 20px; }
  form.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  form.grid .full { grid-column: 1 / -1; }
  label.f { display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
  label.f input { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; color: var(--text); min-width: 0; }

  /* ---------- Responsive ---------- */
  @media (max-width: 1100px) {
    .app, .app.chat-off { grid-template-columns: 180px minmax(0, 1fr); }
    .chat { position: fixed; right: 0; top: 0; bottom: 0; width: min(380px, 100vw); z-index: 35; box-shadow: var(--shadow); }
    .donut-wrap { grid-template-columns: 1fr; justify-items: center; }
    .legend { width: 100%; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 720px) {
    .app, .app.chat-off { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
    nav.side { flex-direction: row; overflow-x: auto; padding: 8px 12px; border-right: 0; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
    .brand { padding: 4px 8px 4px 0; }
    .brand span, .side .foot { display: none; }
    .navbtn { white-space: nowrap; }
    main { padding: 16px 16px 72px; overflow: visible; }
    .day { grid-template-columns: 1fr; gap: 6px; }
    .stats { grid-template-columns: 1fr 1fr; }
    .month { grid-template-columns: 30px repeat(7, minmax(0, 1fr)); }
    .cell { min-height: 54px; padding: 2px; }
    .cell .ev { font-size: 0; height: 5px; padding: 0; border-radius: 3px; }
    .hide-sm { display: none; }
    .avail { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .bars .br { grid-template-columns: 1fr; gap: 4px; }
    .legend .lr { grid-template-columns: 12px minmax(0, 1fr) 44px 50px; }
    form.grid { grid-template-columns: 1fr; }
  }

// Grade projection: ungraded non-final items are assumed to match the current average; a hurdle floors the final.
const BANDS = [["H1", 80], ["H2A", 75], ["H2B", 70], ["H3", 65], ["P", 50]];

function project(c) {
  const known = c.assess.filter((a) => a.w != null);
  const graded = known.filter((a) => a.s != null); // a running quiz average counts as graded so far
  const gw = graded.reduce((x, a) => x + a.w, 0);
  const earned = graded.reduce((x, a) => x + (a.w * a.s) / 100, 0);
  const avg = gw ? (100 * earned) / gw : null;
  const fin = c.assess.find((a) => a.final);
  const otherPending = known.filter((a) => !graded.includes(a) && !a.final).reduce((x, a) => x + a.w, 0);
  const goal = BANDS.find(([b]) => b === targetBand)[1];
  let need = null, byHurdle = false;
  if (fin && avg != null) {
    need = (100 * (goal - earned - (otherPending * avg) / 100)) / fin.w;
    if (fin.hurdle != null && need < fin.hurdle) { need = fin.hurdle; byHurdle = true; }
  }
  return { gw, earned, avg, need, byHurdle, totalKnown: known.reduce((x, a) => x + a.w, 0), graded };
}

// Score-structure donut: one arc per assessment, length = weight; earned part solid, lost part light,
// ungraded thin outline, unknown weight a dashed sliver.
function arc(cx, cy, r, a0, a1) {
  const p = (a) => [cx + r * Math.cos(a - Math.PI / 2), cy + r * Math.sin(a - Math.PI / 2)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function donut(c, pr) {
  const UNK = 6; // degrees given to an unknown-weight item, purely visual
  const unk = c.assess.filter((a) => a.w == null).length;
  const scale = (360 - unk * UNK) / Math.max(pr.totalKnown, 100);
  const GAP = 2, TAU = Math.PI / 180;
  let at = 0, paths = "";
  c.assess.forEach((a) => {
    const span = a.w == null ? UNK : a.w * scale;
    const s0 = (at + GAP / 2) * TAU, s1 = (at + span - GAP / 2) * TAU;
    if (a.w == null) paths += `<path class="unk" d="${arc(100, 100, 82, s0, s1)}"/>`;
    else if (pr.graded.includes(a)) {
      const mid = s0 + (s1 - s0) * (a.s / 100);
      paths += `<path class="earned" d="${arc(100, 100, 82, s0, mid)}"/><path class="lost" d="${arc(100, 100, 82, mid, s1)}"/>`;
    } else paths += `<path class="pend" d="${arc(100, 100, 82, s0, s1)}"/>`;
    at += span;
  });
  return `<svg class="donut" viewBox="0 0 200 200" role="img" aria-label="${t("scoreStructure")}">${paths}
    <text x="100" y="100" font-size="30" font-weight="700">${pr.earned.toFixed(1)}</text>
    <text x="100" y="122" font-size="11" style="fill:var(--muted)">${t("earned")} / 100</text></svg>`;
}

function renderWeek() {
  const mon = mondayOf(TODAY), tw = teachingWeek(mon), att = attention();

  const head = `<div class="ph"><h1>${t("navWeek")} <span class="sub num-t">${md(mon)}–${md(addDays(mon, 6))} · ${tw ? "W" + tw.n : ""}</span></h1><span class="spacer"></span>

    const cls = same(d, TODAY) ? "today" : d < TODAY ? "past" : "";

      <span class="sub num-t">${t("avail")} ${cap}${t("h")} · ${t("planned")} ${used}${t("h")}</span></div>
      <div class="items">${items.map((p) => `<button type="button" class="item ${p.done ? "done" : ""}" data-plan="${plan.indexOf(p)}"><i class="ck"></i>

        <span class="sub num-t">${p.act != null ? `${p.act}/` : ""}${p.h}${t("h")}</span></button>`).join("") || `<span class="sub">—</span>`}</div></div>`;

  return head + attn + `<div class="days">${days}${over}</div><div style="margin-top:12px"><button class="btn" type="button" id="addExt">${t("addExt")}</button></div>`;
}
function renderMonth() {
  const first = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
  let day = mondayOf(first), html = `<div class="month"><div class="dow"></div>${DOW[settings.lang].map((w) => `<div class="dow">${w}</div>`).join("")}`;
  for (let r = 0; r < 6; r++) {
    const tw = teachingWeek(day);
    html += `<div class="wk ${tw?.brk ? "break" : ""}">${tw ? (tw.brk ? t("brk") : "W" + tw.n) : "·"}</div>`;
    for (let c = 0; c < 7; c++, day = addDays(day, 1)) {
      const dues = courses.flatMap((co) => co.assess.filter((a) => a.due && same(a.due, day)).map((a) => `<span class="ev due">${co.code} · ${esc(a.n)}</span>`));
      const blocks = day.getMonth() === 9 && day >= mondayOf(TODAY) && day <= addDays(mondayOf(TODAY), 6) ? plan.filter((p) => p.d === day.getDate()).map((p) => `<span class="ev">${esc(p.title)}</span>`) : [];
      const evs = [...dues, ...blocks];
      html += `<div class="cell ${day.getMonth() !== TODAY.getMonth() ? "out" : ""} ${same(day, TODAY) ? "today" : ""}"><span class="num">${day.getDate()}</span>${evs.slice(0, 3).join("")}${evs.length > 3 ? `<span class="sub">+${evs.length - 3}</span>` : ""}</div>`;
    }
  }
  return html + "</div>";
}

// ===================== Chat (#134, #137) =====================
// runState: "waiting" (quiz filled, awaiting confirmation) | "submitted" | "cancelled" | "running"
let runState = "waiting", shotOpen = -1;
const msgs = [
  { who: "ag", text: "早上好。本周还有 4 项，今天排了 3h。Weekly quiz 11 我已经填好了，等你确认提交。" },
  { who: "run" },
];
const RUN = { title: "COMP90099 · Weekly quiz 11", steps: ["打开 Weekly quiz 11", "读题（1–5）", "检查授权：L1 允许 quiz", "填写第 1–5 题"],
  answers: [["Q1", "B"], ["Q2", "Observer"], ["Q3", "O(n log n)"], ["Q4", "C, D"], ["Q5", "False"]] };
let runSteps = RUN.steps.length;
function renderChat() {
  $("#msgs").innerHTML = msgs.map((m, i) => {
    if (m.who !== "run") return `<div class="msg ${m.who}">${esc(m.text)}</div>`;
    const steps = RUN.steps.map((s, j) => `<div class="step ${j < runSteps ? "ok" : ""}"><span>${j < runSteps ? "✓" : "…"}</span><span>${s}</span>${j < runSteps ? `<button type="button" class="shot" data-shot="${j}">${t("shot")}</button>` : "<span></span>"}
      ${shotOpen === j ? `<div class="shotbox">${t("shot")} · ${s}</div>` : ""}</div>`).join("");
    const conf = runState === "waiting" ? `<div class="confirm" id="confirmCard"><h4>${t("answersTitle")}</h4><div class="answers">${RUN.answers.map(([q, a]) => `<span>${q}</span><b>${esc(a)}</b>`).join("")}</div>
      <div style="display:flex;gap:8px"><button class="btn sm alert" type="button" data-act="submit">${t("confirmSubmit")}</button><button class="btn sm" type="button" data-act="cancel">${t("cancelRun")}</button></div></div>` : "";
    return `<div class="run"><div class="rh"><span>agent · ${RUN.title}</span><button class="btn sm" type="button" data-noop>${t("viewInEdge")}</button></div>${steps}${conf}</div>`;
  }).join("");
  $("#msgs").scrollTop = $("#msgs").scrollHeight;
}
// Fake streaming reply, character by character.
function agentSay(text) {
  const m = { who: "ag", text: "" }; msgs.push(m);
  let i = 0; const tick = () => { m.text = text.slice(0, ++i); renderChat(); if (i < text.length) setTimeout(tick, 18); };
  tick();
}
function replyTo(q) {
  const ctx = contextLabel();
  if (/练习|practice/i.test(q)) return agentSay(`第 1 题（${ctx}）：Observer 和 Strategy 都把变化的部分抽出去，二者的关键区别是什么？`);
  if (/做|do |complete/i.test(q)) {
    if (page.kind === "assess" && courseOf(page.code).policy === "forbid") return agentSay("这门课的 AI 政策禁止使用 AI，等级锁在 L0。我可以帮你排期和复习，但不能替你完成。");
    return agentSay(`好的，我先检查 ${ctx} 的授权等级，再打开页面。每一步会显示在这里，提交前等你确认。`);
  }
  agentSay(`（${ctx}）收到。这是原型，回复是示例文本。`);
}

    <div class="mb"><p class="sub">${p.ext ? t("ext") : p.course} · ${t("est")} ${p.h}${t("h")}</p>
    <form class="grid" id="actForm" data-i="${i}"><label class="f">${t("actual")}<input name="act" type="number" min="0" step="0.25" value="${p.act ?? ""}"></label>
      <div style="display:flex;align-items:end;gap:8px;justify-content:flex-end"><button class="btn" type="button" data-close>${t("cancel")}</button><button class="btn ink" type="submit">${t("save")}</button></div></form></div>`, "#actForm input");
}

// ===================== Apply settings =====================
function applyTheme() { if (settings.theme === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = settings.theme; }
function applyChat() { $("#app").classList.toggle("chat-off", !settings.chat); }
function applyLang() {
  document.documentElement.lang = settings.lang === "en" ? "en" : "zh-CN";
  document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t(el.dataset.i18n)));
  $("#chatText").placeholder = t("chatPh");
  $("#lastSync").textContent = `${t("lastSync")} 10/15 09:12`;
}
function renderAll() { applyLang(); render(); renderChat(); }

// ===================== Events =====================
document.addEventListener("click", (e) => {
  const el = e.target;
  if (el.closest("[data-noop]")) { e.preventDefault(); return; }
  const nv = el.closest("[data-nav]"); if (nv) { go({ kind: nv.dataset.nav }); return; }
  const wv = el.closest("[data-wv]"); if (wv) { weekView = wv.dataset.wv; render(); return; }
  const cs = el.closest("[data-course]"); if (cs) { go({ kind: "course", code: cs.dataset.course }); return; }
  const as = el.closest("[data-assess]"); if (as) { const [code, id] = as.dataset.assess.split("|"); go({ kind: "assess", code, id }); return; }
  const rv = el.closest("[data-rv]"); if (rv) { go({ kind: "review", code: rv.dataset.rv }); return; }
  const ci = el.closest("[data-cite]"); if (ci) { openCite = openCite === ci.dataset.cite ? null : ci.dataset.cite; render(); return; }
  const ed = el.closest("[data-edit]"); if (ed) { editing = ed.dataset.edit; openCite = null; render(); $("[data-editval]")?.focus(); return; }
  const sw = el.closest("[data-confirm]"); if (sw) { const c = courseOf(sw.dataset.confirm); c.confirm = !c.confirm; render(); return; }
  const pl = el.closest("[data-plan]"); if (pl) { openPlanItem(+pl.dataset.plan); return; }
  const sh = el.closest("[data-shot]"); if (sh) { shotOpen = shotOpen === +sh.dataset.shot ? -1 : +sh.dataset.shot; renderChat(); return; }
  const th = el.closest("[data-theme-opt]"); if (th) { settings.theme = th.dataset.themeOpt; store.set("theme", settings.theme); applyTheme(); render(); return; }
  const lg = el.closest("[data-lang]"); if (lg) { settings.lang = lg.dataset.lang; store.set("lang", settings.lang); renderAll(); return; }
  if (el.closest("[data-close]") || el.id === "scrim") { closeModal(); return; }
  if (el.closest("#addExt")) { openAddExt(); return; }
  if (el.closest("#chatClose")) { settings.chat = false; store.set("chat", false); applyChat(); return; }
  if (el.closest("#chatOpen")) { settings.chat = true; store.set("chat", true); applyChat(); return; }
  if (el.closest("#syncBtn")) { const b = el.closest("#syncBtn"); b.textContent = t("syncing"); b.disabled = true; setTimeout(() => render(), 1200); return; }
  const act = el.closest("[data-act]")?.dataset.act;
  if (act === "open-run") { settings.chat = true; applyChat(); renderChat(); $("#confirmCard")?.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  if (act === "go-settings") { go({ kind: "settings" }); return; }
  if (act === "submit" || act === "cancel") {
    runState = act === "submit" ? "submitted" : "cancelled";
    if (act === "submit") { audit[0] = ["10/15 " + hhmm(new Date()), "COMP90099", "Weekly quiz 11", "填写并提交", "L1", "前端确认"]; plan.find((p) => p.waiting).done = true; }
    msgs.push({ who: "ag", text: t(act === "submit" ? "submittedMsg" : "cancelledMsg") }); renderChat(); render(); return;
  }
  if (act === "ask") { settings.chat = true; applyChat(); const q = settings.lang === "en" ? "Do this one" : "帮我做这个"; msgs.push({ who: "me", text: q }); replyTo(q); return; }
  if (act === "practice" || act === "practice-wrong") { settings.chat = true; applyChat(); const q = act === "practice" ? "开始练习" : "只做错题，开始练习"; msgs.push({ who: "me", text: q }); replyTo(q); return; }
});
document.addEventListener("change", (e) => {
  const lv = e.target.closest("[data-lv]"); if (lv) { const [code, id] = lv.dataset.lv.split("|"); const a = courseOf(code).assess.find((x) => x.id === id); a.lv = lv.value === " " ? undefined : +lv.value; render(); return; }
  const dl = e.target.closest("[data-deflv]"); if (dl) { courseOf(dl.dataset.deflv).level = +dl.value; render(); return; }
  if (e.target.id === "band") { targetBand = e.target.value; render(); return; }
  if (e.target.closest("#availForm")) { const f = new FormData($("#availForm")); for (let i = 0; i < 7; i++) avail[i] = Number(f.get("d" + i)) || 0; store.set("avail", avail); return; }
});
document.addEventListener("input", (e) => {
  const inp = e.target.closest("[data-score]"); if (!inp) return;
  const [code, id] = inp.dataset.score.split("|"), c = courseOf(code), a = c.assess.find((x) => x.id === id);
  a.s = inp.value === "" ? undefined : Math.max(0, Math.min(100, Number(inp.value)));
  if (a.s != null && a.st !== "graded" && a.k !== "quiz") a.st = "graded";
  $("#needV").textContent = needText(project(c));
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeModal(); if (editing) { editing = null; render(); } }
  const ev = e.target.closest?.("[data-editval]");
  if (ev && e.key === "Enter") {
    const a = courseOf(page.code).assess.find((x) => x.id === page.id), v = Number(ev.value);
    if (ev.dataset.editval === "w") { a.w = v; a.wSrc = "u"; } else if (ev.dataset.editval === "est") { a.est = v; a.estSrc = "u"; } else if (ev.dataset.editval === "k") { /* type edits not in the prototype */ }
    editing = null; render();
  }
  if (e.target.id === "chatText" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#chatForm").requestSubmit(); }
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  if (e.target.id === "chatForm") { const q = $("#chatText").value.trim(); if (!q) return; $("#chatText").value = ""; msgs.push({ who: "me", text: q }); replyTo(q); return; }
  if (e.target.id === "extForm") {
    const d = Number(f.get("due").split("-")[2]);
    plan.push({ d: d >= 12 && d <= 18 ? d : 17, title: f.get("title"), ext: true, h: Number(f.get("h")) || 1 }); closeModal(); render(); return;
  }
  if (e.target.id === "actForm") { const p = plan[+e.target.dataset.i]; p.act = f.get("act") === "" ? undefined : Number(f.get("act")); p.done = p.act != null || p.done; closeModal(); render(); }
});

// On narrow screens the chat is an overlay, so it starts collapsed behind the Agent button.
if (window.matchMedia("(max-width: 1100px)").matches) settings.chat = false;
applyTheme(); applyChat(); renderAll();
</script>
</body>
</html>
