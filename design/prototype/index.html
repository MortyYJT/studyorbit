<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>coursework 原型</title>
<!--
  Static UI prototype for `coursework ui` (PRD: note/product/prd.md; decisions #142-#144).
  Pages: this week (seven day columns, all-day row on top, timed tasks top-down) with a course
  rail; a course page (score ring, assessments, revision); the agent page (history + chat,
  opened with preset prompts). Settings and status live in the avatar menu.
  All data is synthetic. No network access, no dependencies.
-->
<style>
  :root {
    --bg: #fafafa; --panel: #ffffff; --text: #0a0a0a; --muted: #6b6b6b; --faint: #a3a3a3;
    --line: #e7e7e7; --hover: #f2f2f2; --ink: #0a0a0a; --on-ink: #ffffff; --lost: #c9c9c9;
    --alert: #d9480f; --alert-bg: #fff4ed;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.08);
    --radius: 12px; --ease: cubic-bezier(.2,.8,.2,1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0b0b; --panel: #141414; --text: #f2f2f2; --muted: #9a9a9a; --faint: #5c5c5c;
      --line: #262626; --hover: #1c1c1c; --ink: #f2f2f2; --on-ink: #0b0b0b; --lost: #4a4a4a;
      --alert: #ff8a4c; --alert-bg: #2a1609; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0b0b; --panel: #141414; --text: #f2f2f2; --muted: #9a9a9a; --faint: #5c5c5c;
    --line: #262626; --hover: #1c1c1c; --ink: #f2f2f2; --on-ink: #0b0b0b; --lost: #4a4a4a;
    --alert: #ff8a4c; --alert-bg: #2a1609; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
  .sub { font-size: 12px; color: var(--muted); }
  .n { font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  .view { animation: in .35s var(--ease); }
  @keyframes in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

  /* ---------- Header ---------- */
  header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 6px; padding: 10px 24px;
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .brand { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 0; margin-right: 14px; }
  .brand .dot { width: 10px; height: 10px; background: var(--ink); border-radius: 3px; transform: rotate(45deg); }
  .tab { border: 0; background: none; padding: 6px 12px; border-radius: 8px; color: var(--muted); }
  .tab:hover { background: var(--hover); color: var(--text); }
  .tab[aria-current="page"] { background: var(--ink); color: var(--on-ink); }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 6px 14px; }
  .btn:hover { background: var(--hover); }
  .btn.ink { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .btn.alert { background: var(--alert); color: #fff; border-color: var(--alert); }
  .btn.sm { padding: 3px 10px; font-size: 12px; border-radius: 8px; }
  .icon-btn { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .seg { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .seg button { border: 0; background: none; padding: 3px 12px; border-radius: 7px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
  .avatar-wrap { position: relative; margin-left: 6px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--ink); color: var(--on-ink); font-weight: 700; }
  .badge-dot { position: absolute; right: -1px; top: -1px; width: 10px; height: 10px; border-radius: 50%; background: var(--alert); border: 2px solid var(--bg); pointer-events: none; }
  .menu { position: absolute; right: 0; top: calc(100% + 8px); width: 220px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 6px; display: none; }
  .menu.open { display: block; }
  .menu button { display: flex; width: 100%; gap: 10px; border: 0; background: none; padding: 8px 10px; border-radius: 8px; text-align: left; }
  .menu button:hover { background: var(--hover); }
  .menu .hint { margin-left: auto; font-size: 11px; color: var(--alert); }

  /* ---------- Layout ---------- */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 20px; padding: 20px 24px 60px; max-width: 1360px; margin: 0 auto; }
  .layout.full { grid-template-columns: minmax(0, 1fr); }
  .layout.full .rail { display: none; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .pad { padding: 14px 16px; }
  h2.sec { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .attn { border: 1px solid var(--alert); background: var(--alert-bg); border-radius: var(--radius); padding: 10px 14px; display: grid; gap: 6px; margin-bottom: 14px; }
  .attn .it { display: flex; align-items: center; gap: 10px; }
  .attn .it span { flex: 1; }
  .attn b { color: var(--alert); font-size: 13px; }

  /* ---------- Week: seven columns (#143) ---------- */
  .week { display: grid; grid-template-columns: 64px repeat(7, minmax(0, 1fr)); grid-template-rows: auto auto 1fr; }
  .dcol { display: grid; grid-row: span 3; grid-template-rows: subgrid; border-right: 1px solid var(--line); min-width: 0; }
  .dcol:last-child { border-right: 0; }
  .wh { padding: 10px 8px; border-bottom: 1px solid var(--line); }
  .wh b { display: block; font-size: 13px; }
  .wh.today b { display: inline-grid; place-items: center; background: var(--ink); color: var(--on-ink); border-radius: 6px; padding: 0 6px; }
  .wh.past { opacity: .5; }
  .lbl { padding: 8px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .labels .lbl:last-child { border-bottom: 0; }
  .allday { padding: 6px; min-height: 34px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; align-content: start; background: var(--hover); }
  .timed { padding: 6px; display: grid; gap: 6px; align-content: start; min-height: 260px; }
  .col-past { opacity: .5; }
  .due { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 5px; background: var(--ink); color: var(--on-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blk { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 7px; text-align: left; font-size: 12px; width: 100%; line-height: 1.35; }
  .blk:hover { border-color: var(--faint); }
  .blk .tm { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .blk .cr { font-size: 11px; color: var(--muted); }
  .blk.done { opacity: .55; }
  .blk.done .tt { text-decoration: line-through; text-decoration-color: var(--faint); }
  .blk.ext { border-style: dashed; }
  .blk.waiting { border-color: var(--alert); box-shadow: inset 3px 0 0 var(--alert); }
  .cap { font-size: 11px; color: var(--muted); }
  .over { padding: 10px 14px; border-top: 1px dashed var(--faint); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  /* Month (kept from the earlier prototype) */
  .month { display: grid; grid-template-columns: 40px repeat(7, minmax(0, 1fr)); }
  .month .dow { padding: 8px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .wk { padding: 8px 2px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); font-size: 12px; text-align: center; font-weight: 600; }
  .cell { min-height: 84px; padding: 4px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); min-width: 0; }
  .cell:nth-child(8n) { border-right: 0; }
  .cell.out .num { color: var(--faint); }
  .num { font-size: 12px; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; }
  .cell.today .num { background: var(--ink); color: var(--on-ink); font-weight: 700; }
  .cell .due { display: block; margin-top: 2px; }

  /* ---------- Rail ---------- */
  .rail { display: grid; gap: 10px; align-content: start; }
  .crs { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; padding: 8px; border-radius: 10px; border: 0; background: none; text-align: left; width: 100%; }
  .crs:hover { background: var(--hover); }
  .crs b { display: block; }
  .ring { width: 44px; height: 44px; }
  .ring circle { fill: none; stroke-width: 4; }
  .ring .bg { stroke: var(--line); }
  .ring .fg { stroke: var(--ink); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .9s var(--ease); }

  /* ---------- Course page ---------- */
  .crumbs button { border: 0; background: none; padding: 2px 0; color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .chead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .chead h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
  .score { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 22px; align-items: center; }
  .donut { width: 170px; height: 170px; }
  .donut path { fill: none; stroke-width: 16; }
  .donut .earned { stroke: var(--ink); } .donut .lost { stroke: var(--lost); } .donut .pend { stroke: var(--line); }
  .donut .unk { stroke: var(--faint); stroke-width: 2; stroke-dasharray: 3 4; }
  .donut text { fill: var(--text); text-anchor: middle; }
  .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .facts .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .facts select, .policy select, .field select { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; font-size: 12px; }
  .key { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; font-size: 11px; color: var(--muted); }
  .key i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 18px 0 0; }
  .tabs button { border: 0; background: none; padding: 9px 10px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button[aria-selected="true"] { color: var(--text); border-color: var(--ink); }
  .arow { display: grid; grid-template-columns: minmax(0, 1fr) 56px 54px 50px; gap: 10px; align-items: center; padding: 10px 4px; border: 0; border-bottom: 1px solid var(--line); background: none; width: 100%; text-align: left; }
  .arow:hover { background: var(--hover); }
  .arow .w { text-align: right; }
  .kind { font-size: 10px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--line); margin-left: 6px; color: var(--muted); }
  .kind.exam { border: 1.5px solid var(--ink); color: var(--text); font-weight: 700; }
  .unknown { color: var(--muted); font-style: italic; }
  .pill { font-size: 11px; padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
  .pill.lock { border-style: dashed; color: var(--muted); }
  .policy { display: flex; gap: 8px 18px; flex-wrap: wrap; align-items: center; font-size: 13px; margin-top: 14px; }
  .switch { width: 32px; height: 18px; border-radius: 9px; background: var(--line); border: 0; position: relative; padding: 0; vertical-align: middle; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); transition: transform .2s var(--ease); }
  .switch[aria-checked="true"] { background: var(--ink); }
  .switch[aria-checked="true"]::after { transform: translateX(14px); }
  .srcm { font-size: 11px; color: var(--muted); border: 0; background: none; padding: 0 2px; }
  button.srcm { text-decoration: underline dotted; text-underline-offset: 3px; }
  .cite { margin: 6px 0 2px; padding: 9px 12px; border-left: 2px solid var(--ink); background: var(--hover); border-radius: 0 8px 8px 0; font-size: 13px; }
  .cite .src { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .note-row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--line); }
  .revgo { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 16px; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }

  /* ---------- Agent page (#144) ---------- */
  .agent { display: grid; grid-template-columns: 240px minmax(0, 1fr); height: calc(100vh - 56px - 40px); min-height: 480px; overflow: hidden; }
  .hist { border-right: 1px solid var(--line); padding: 10px; overflow: auto; display: grid; gap: 2px; align-content: start; }
  .hist button { border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 8px; display: grid; }
  .hist button:hover { background: var(--hover); }
  .hist button[aria-current="true"] { background: var(--hover); font-weight: 600; }
  .hist .dotw { color: var(--alert); }
  .conv { display: flex; flex-direction: column; min-height: 0; }
  .conv-h { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: baseline; }
  .msgs { flex: 1; overflow: auto; padding: 18px; display: grid; gap: 10px; align-content: start; max-width: 760px; width: 100%; margin: 0 auto; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; }
  .msg.me { justify-self: end; background: var(--ink); color: var(--on-ink); }
  .msg.ag { justify-self: start; background: var(--hover); }
  .preset { font-size: 11px; color: var(--muted); justify-self: end; margin-top: -6px; }
  .run { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 4px; }
  .confirm { border: 1.5px solid var(--alert); background: var(--alert-bg); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; margin-top: 6px; }
  .chat-in { border-top: 1px solid var(--line); padding: 12px 18px; display: flex; gap: 8px; max-width: 796px; width: 100%; margin: 0 auto; }
  .chat-in input { flex: 1; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 9px 12px; min-width: 0; }

  /* ---------- Drawer & modal ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 40; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); background: var(--panel); border-left: 1px solid var(--line); box-shadow: var(--shadow);
    z-index: 50; transform: translateX(104%); transition: transform .35s var(--ease); overflow: auto; padding: 18px 22px; }
  .drawer.on { transform: none; }
  .field { display: grid; grid-template-columns: 80px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .field .k { color: var(--muted); font-size: 13px; }
  .field .cite { grid-column: 1 / -1; }
  .modal { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto; background: var(--panel);
    border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); z-index: 50; display: none; }
  .modal.on { display: block; }
  .mh { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .mh h2 { margin: 0; font-size: 16px; }
  .mtabs { display: flex; gap: 4px; padding: 0 18px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .mtabs button { border: 0; background: none; padding: 9px 8px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .mtabs button[aria-selected="true"] { color: var(--text); border-color: var(--ink); }
  .mb { padding: 14px 18px 20px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .row:first-child { border-top: 0; }
  .sdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); margin-right: 6px; }
  .sdot.bad { background: var(--alert); }
  .avail { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .avail label { display: grid; gap: 2px; font-size: 11px; color: var(--muted); text-align: center; }
  .avail input { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 4px; text-align: center; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .kpi .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 7px 4px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  form.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  form.grid .full { grid-column: 1 / -1; }
  label.f { display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
  label.f input, label.f select { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; color: var(--text); min-width: 0; }

  /* ---------- Responsive ---------- */
  @media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } }
  @media (max-width: 760px) {
    header { padding: 8px 12px; } .brand span { display: none; } .brand { margin-right: 4px; }
    .layout { padding: 12px 12px 60px; }
    .week { display: block; }
    .dcol { display: block; border-right: 0; border-bottom: 1px solid var(--line); }
    .dcol.labels { display: none; }
    .allday:empty { display: none; }
    .timed { min-height: 0; }
    .score { grid-template-columns: 1fr; justify-items: center; }
    .facts { width: 100%; }
    .month { grid-template-columns: 28px repeat(7, minmax(0, 1fr)); }
    .cell { min-height: 50px; } .cell .due { font-size: 0; height: 5px; padding: 0; }
    .arow { grid-template-columns: minmax(0, 1fr) 44px 50px; } .arow .lvc { display: none; }
    .agent { grid-template-columns: 1fr; height: calc(100vh - 110px); }
    .hist { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    .hist button { white-space: nowrap; }
    .avail { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    form.grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <button class="brand" type="button" data-go="week"><i class="dot" aria-hidden="true"></i><span>coursework</span></button>
  <button class="tab" type="button" data-go="week" id="tabWeek"></button>
  <button class="tab" type="button" data-go="agent" id="tabAgent"></button>
  <span class="spacer"></span>
  <button class="btn" type="button" id="syncBtn"></button>
  <div class="avatar-wrap">
    <button class="avatar" id="avatarBtn" type="button" aria-haspopup="menu" aria-label="menu">M</button><span class="badge-dot"></span>
    <div class="menu" id="menu" role="menu"></div>
  </div>
</header>
<div class="layout" id="layout"><main id="main" aria-live="polite"></main><aside class="rail" id="rail"></aside></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>

<script>
// ===================== i18n =====================
const STR = {
  zh: { sync: "↻ 同步", syncing: "同步中…", week: "本周", agent: "Agent", plan: "计划", month: "月历", needYou: "需要你处理", review: "去确认", relogin: "重新登录",
    courses: "课程", next: "下一个截止", none: "无", graded: "已出分", addExt: "＋ 校外任务", ext: "校外", over: "排不下", due: "截止", h: "h", allDay: "全天", timed: "按时间",
    back: "← 本周", policy: "AI 政策", allow: "允许", forbid: "禁止", level: "等级", confirmFirst: "提交前要我确认", locked: "锁在 L0",
    levelNote: "L0 只读 · L1 自动完成 quiz · L2 自动完成作业和论文", earned: "已拿到", avg: "当前平均", needFinal: "期末需要", unreachable: "已无法达到", safe: "已稳",

// Grade projection: ungraded non-final items assumed at the current average; a hurdle floors the final.
let band = "H1";
const BANDS = [["H1", 80], ["H2A", 75], ["H2B", 70], ["H3", 65], ["P", 50]];
function project(c) {
  const known = c.assess.filter((a) => a.w != null), graded = known.filter((a) => a.s != null);
  const gw = graded.reduce((x, a) => x + a.w, 0), earned = graded.reduce((x, a) => x + (a.w * a.s) / 100, 0);
  const avg = gw ? (100 * earned) / gw : null, fin = c.assess.find((a) => a.final);
  const rest = known.filter((a) => !graded.includes(a) && !a.final).reduce((x, a) => x + a.w, 0);
  let need = null;
  if (fin && avg != null) { need = (100 * (BANDS.find(([b]) => b === band)[1] - earned - (rest * avg) / 100)) / fin.w; if (fin.hurdle && need < fin.hurdle) need = fin.hurdle; }
  return { gw, earned, avg, need, graded, total: known.reduce((x, a) => x + a.w, 0) };
}
const needText = (p) => p.need == null ? "—" : p.need > 100 ? t("unreachable") : p.need <= 0 ? t("safe") : p.need.toFixed(0) + "%";
const RR = 18, CC = 2 * Math.PI * RR;
const ring = (p) => `<svg class="ring" viewBox="0 0 44 44" aria-hidden="true"><circle class="bg" cx="22" cy="22" r="${RR}"/><circle class="fg" cx="22" cy="22" r="${RR}" stroke-dasharray="${CC}" stroke-dashoffset="${CC}" data-target="${CC * (1 - p)}"/></svg>`;
function arc(r, a0, a1) {
  const pt = (a) => [85 + r * Math.cos(a - Math.PI / 2), 85 + r * Math.sin(a - Math.PI / 2)];
  const [x0, y0] = pt(a0), [x1, y1] = pt(a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
// Score-structure donut: one arc per assessment sized by weight; earned solid, lost mid-grey, ungraded light, unknown weight dashed.
function donut(c, p) {
  const UNK = 8, unk = c.assess.filter((a) => a.w == null).length, scale = (360 - unk * UNK) / Math.max(p.total, 100), R = Math.PI / 180;
  let at = 0, out = "";
  c.assess.forEach((a) => {
    const span = a.w == null ? UNK : a.w * scale, s0 = (at + 1.2) * R, s1 = (at + span - 1.2) * R;
    if (a.w == null) out += `<path class="unk" d="${arc(70, s0, s1)}"/>`;
    else if (p.graded.includes(a)) { const m = s0 + (s1 - s0) * (a.s / 100); out += `<path class="earned" d="${arc(70, s0, m)}"/><path class="lost" d="${arc(70, m, s1)}"/>`; }
    else out += `<path class="pend" d="${arc(70, s0, s1)}"/>`;
    at += span;
  });
  return `<svg class="donut" viewBox="0 0 170 170" role="img" aria-label="score">${out}<text x="85" y="88" font-size="28" font-weight="700">${p.earned.toFixed(1)}</text>
    <text x="85" y="108" font-size="11" style="fill:var(--muted)">${t("earned")} / 100</text></svg>`;
}

  const list = c.assess.map((a) => `<button type="button" class="arow" data-assess="${a.id}"><span>${esc(a.n)}${a.k !== "work" ? `<span class="kind ${a.k}">${a.k === "exam" ? t("exam") : "quiz"}</span>` : ""}</span>
    <span class="n w">${a.w == null ? `<span class="unknown">${t("unknownW")}</span>` : a.w + "%"}</span><span class="n sub">${a.s != null ? a.s + "%" : md(a.due)}</span>
    <span class="lvc sub">${a.k === "exam" ? "—" : "L" + (forbid ? 0 : a.lv ?? c.level)}</span></button>`).join("");
  const r = c.review;
  const rev = !r ? `<p class="sub">${t("noExam")}</p>` : `<div class="note-row"><span>${t("examOn")}</span><b class="n">${md(c.exam)} ${hhmm(c.exam)}</b></div>
    <div class="note-row"><span>${t("scope")}</span><span>${esc(r.scope)} ${srcMark("a", "scope")}</span></div>${citeBox("scope", r.scopeCite)}
    <h2 class="sec" style="margin-top:16px">${t("notes")}</h2>${r.notes.map(([n, w]) => `<div class="note-row"><span>${esc(n)}</span><span class="sub">${w}</span></div>`).join("")}
    <div class="revgo"><div style="flex:1;min-width:200px"><b>${t("qs")}</b> <span class="sub n">${r.q.total} · ${t("done")} ${r.q.done} · ${t("wrong")} ${r.q.wrong}</span><div class="sub">${t("reviewHint")}</div></div>
      <button class="btn ink" type="button" data-act="review-all">${t("goReview")}</button><button class="btn" type="button" data-act="review-wrong" ${r.q.wrong ? "" : "disabled"}>${t("goWrong")}</button></div>`;
  return `<nav class="crumbs"><button type="button" data-go="week">${t("back")}</button></nav>
    <div class="chead"><h1>${c.code}</h1><span class="sub">${esc(c.name)}</span></div>${score}${policy}${tabs}
    <div style="padding-top:6px">${courseTab === "a" ? list : rev}</div>`;
}
function openAssess(id) {
  const c = courseOf(page.code), a = c.assess.find((x) => x.id === id), forbid = c.policy === "forbid", exam = a.k === "exam";
  const f = (k, label, val, src, ci) => `<div class="field"><span class="k">${label}</span><span class="n">${val}</span>${srcMark(src, k)}${citeBox(k, ci)}</div>`;
  $("#drawer").innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><span class="sub">${c.code}</span><button class="icon-btn" data-close type="button" aria-label="close">✕</button></div>
    <h2 style="margin:6px 0 12px">${esc(a.n)}</h2>
    ${f("due", t("dueL"), a.due ? md(a.due) + " " + hhmm(a.due) : "—", a.due ? "p" : "", null)}
    ${f("w", t("weight"), a.w == null ? `<span class="unknown">${t("unknownW")}</span>` : a.w + "%", a.w == null ? "" : a.wSrc, a.wCite)}
    ${f("k", t("type"), (exam ? t("exam") : a.k === "quiz" ? "quiz" : "assignment") + (a.hurdle ? ` · hurdle ≥${a.hurdle}%` : ""), a.kCite ? "a" : "p", a.kCite)}
    ${f("est", t("est"), a.est ? a.est + t("h") : "—", a.est ? a.estSrc : "", cite("Estimated from the brief: a report plus unit tests.", "Agent estimate"))}
    ${f("s", t("score"), a.s != null ? a.s + "%" : "—", a.s != null ? "p" : "", null)}
    ${exam ? "" : `<div class="field"><span class="k">${t("level")}</span>${forbid ? `<span class="pill lock">${t("locked")}</span>` : `<select data-lv="${a.id}"><option value="" ${a.lv == null ? "selected" : ""}>${t("follow")} (L${c.level})</option>${[0, 1, 2].map((l) => `<option value="${l}" ${a.lv === l ? "selected" : ""}>L${l}</option>`).join("")}</select>`}<span></span></div>
    <p class="sub">${t("levelNote")}</p>`}
    ${forbid || exam ? "" : `<button class="btn ink" type="button" data-act="ask" style="width:100%;margin-top:6px">${t("ask")}</button>`}`;
  drawerFor = id; showLayer("#drawer");
}

// ===================== Agent page (#144) =====================
function renderAgent() {
  const cv = convs.find((c) => c.id === current);
  const hist = `<nav class="hist"><button type="button" data-act="new-chat" class="sub">${t("newChat")}</button>${convs.map((c) => `<button type="button" data-conv="${c.id}" aria-current="${c.id === current}">
    <span>${c.id === "quiz11" && runState === "waiting" ? '<span class="dotw">● </span>' : ""}${esc(c.title)}</span><span class="sub">${c.when}</span></button>`).join("")}</nav>`;
  const body = cv.msgs.map((m) => {
    if (m.who === "run") return `<div class="run"><b>${m.title}</b>${m.steps.map((s) => `<div>✓ ${s}</div>`).join("")}
      ${runState === "waiting" ? `<div class="confirm"><b class="sub" style="color:var(--alert)">${t("answers")}</b><div>${m.answers}</div>
        <div><button class="btn sm alert" type="button" data-act="submit">${t("submit")}</button> <button class="btn sm" type="button" data-act="cancel">${t("cancel")}</button></div></div>` : ""}</div>`;
    return `<div class="msg ${m.who}">${esc(m.text)}</div>${m.preset ? `<div class="preset">${t("presetSent")}</div>` : ""}`;
  }).join("");
  return `<div class="card agent">${hist}<section class="conv"><div class="conv-h"><b>${esc(cv.title)}</b><span class="sub">Claude</span></div>
    <div class="msgs" id="msgs">${body}</div>
    <form class="chat-in" id="chatForm"><input id="chatText" autocomplete="off" placeholder="${t("chatPh")}"><button class="btn ink" type="submit">${t("send")}</button></form></section></div>`;
}
// Opens (or creates) a conversation and sends a preset prompt, then streams a canned reply.
function startConv(id, title, prompt, reply) {
  let cv = convs.find((c) => c.id === id);
  if (!cv) { cv = { id, title, when: hhmm(new Date()), msgs: [] }; convs.unshift(cv); }
  current = id; cv.msgs.push({ who: "me", text: prompt, preset: true });
  go({ kind: "agent" }); agentSay(cv, reply);
}
function agentSay(cv, text) {
  const m = { who: "ag", text: "" }; cv.msgs.push(m); let i = 0;
  const tick = () => { m.text = text.slice(0, ++i); if (page.kind === "agent" && current === cv.id) { const box = $("#msgs"); if (box) { box.lastElementChild.textContent = m.text; box.scrollTop = box.scrollHeight; } } if (i < text.length) setTimeout(tick, 14); };
  render(); tick();
}
const reviewPrompt = (c, wrongOnly) => settings.lang === "en"
  ? `Revise ${c.code} with me. Exam scope: ${c.review.scope}. ${wrongOnly ? "Only the questions I got wrong." : "Summarise the key points first, then quiz me one question at a time."} Cite the source for each point.`
  : `带我复习 ${c.code}。考试范围：${c.review.scope}。${wrongOnly ? "只练我做错的题。" : "先用几句话讲重点，再一题一题考我。"}每个知识点注明出处。`;

// ===================== Panels & modals =====================
const PANELS = ["mStatus", "mMetrics", "mAudit", "mSettings"];
function openPanel(tab) {
  const body = {
    mStatus: `<div class="row"><span>${t("lastSync")}</span><span class="n">10/15 09:12 · 3m41s</span></div>
      <div class="row"><span><i class="sdot"></i>Canvas</span><span class="sub">${t("signedIn")}</span></div>
      <div class="row"><span><i class="sdot bad"></i>Ed</span><span>${t("expired")} <button class="btn sm alert" type="button">${t("relogin")}</button></span></div>`,
    mMetrics: `<div class="kpis"><div class="kpi"><div class="v">3m41s · 92%</div><div class="sub">${t("kSync")}</div></div><div class="kpi"><div class="v">91%</div><div class="sub">${t("kAcc")}</div></div>
      <div class="kpi"><div class="v">+24%</div><div class="sub">${t("kEst")}</div></div><div class="kpi"><div class="v">23 · $0.06</div><div class="sub">${t("kAgent")}</div></div></div><p class="sub">${t("sample")}</p>`,
    mAudit: `<table><thead><tr><th>${t("when")}</th><th>${t("item")}</th><th>${t("action")}</th><th>${t("how")}</th></tr></thead><tbody>${audit.map((r) => `<tr>${r.map((x) => `<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table>`,
    mSettings: `<div class="sub" style="margin-bottom:6px">${t("availT")}</div><form class="avail" id="availForm">${DOW[settings.lang].map((d, i) => `<label>${d}<input type="number" min="0" max="16" step="0.5" name="d${i}" value="${avail[i]}"></label>`).join("")}</form>
      <div class="row" style="margin-top:12px"><span>${t("theme")}</span><div class="seg">${["system", "light", "dark"].map((k) => `<button type="button" data-theme-opt="${k}" aria-pressed="${settings.theme === k}">${t(k)}</button>`).join("")}</div></div>
      <div class="row"><span>${t("lang")}</span><div class="seg">${[["zh", "中文"], ["en", "English"]].map(([k, l]) => `<button type="button" data-lang="${k}" aria-pressed="${settings.lang === k}">${l}</button>`).join("")}</div></div>`,
  }[tab];
  $("#modal").innerHTML = `<div class="mh"><h2>${t(tab)}</h2><button class="icon-btn" data-close type="button" aria-label="close">✕</button></div>
    <div class="mtabs">${PANELS.map((k) => `<button type="button" data-panel="${k}" aria-selected="${k === tab}">${t(k)}</button>`).join("")}</div><div class="mb">${body}</div>`;
  showLayer("#modal");
}
function openAddExt() {
  $("#modal").innerHTML = `<div class="mh"><h2>${t("newExt")}</h2><button class="icon-btn" data-close type="button">✕</button></div>
    <div class="mb"><form class="grid" id="extForm"><label class="f full">${t("name")}<input name="title" required placeholder="${t("phExt")}"></label>
      <label class="f">${t("dueL")}<input name="due" type="date" value="2026-10-17" required></label>
      <label class="f">${t("start")}<select name="at"><option value="">${t("allDay")}</option>${["09:00", "13:00", "19:00"].map((x) => `<option>${x}</option>`).join("")}</select></label>
      <label class="f">${t("estH")}<input name="h" type="number" min="0.5" step="0.5" value="1"></label>
      <div class="full" style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" type="button" data-close>${t("cancel")}</button><button class="btn ink" type="submit">${t("create")}</button></div></form></div>`;
  showLayer("#modal"); setTimeout(() => $("#extForm input").focus(), 50);
}
function openPlan(i) {
  const p = plan[i];
  $("#modal").innerHTML = `<div class="mh"><h2>${esc(p.title)}</h2><button class="icon-btn" data-close type="button">✕</button></div>
    <div class="mb"><p class="sub">${p.ext ? t("ext") : p.course} · ${p.at ? p.at + "–" + endAt(p.at, p.h) : t("allDay")} · ${t("est")} ${p.h}${t("h")}</p><form class="grid" id="actForm" data-i="${i}">
      <label class="f">${t("actual")}<input name="act" type="number" min="0" step="0.25" value="${p.act ?? ""}"></label>
      <div style="display:flex;align-items:end;justify-content:flex-end;gap:8px"><button class="btn" type="button" data-close>${t("cancel")}</button><button class="btn ink" type="submit">${t("save")}</button></div></form></div>`;
  showLayer("#modal");
}
function showLayer(sel) { $("#scrim").classList.add("on"); $(sel).classList.add("on"); }
function closeLayers() { $("#scrim").classList.remove("on"); $("#drawer").classList.remove("on"); $("#modal").classList.remove("on"); drawerFor = null; }

// ===================== Wiring =====================
function applyTheme() { if (settings.theme === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = settings.theme; }
function applyLang() {
  document.documentElement.lang = settings.lang === "en" ? "en" : "zh-CN";
  $("#syncBtn").textContent = t("sync"); $("#tabWeek").textContent = t("week"); $("#tabAgent").textContent = t("agent");
  $("#menu").innerHTML = PANELS.map((k) => `<button role="menuitem" data-panel="${k}">${t(k)}${k === "mStatus" ? `<span class="hint">Ed ${t("expired")}</span>` : ""}</button>`).join("");
}
document.addEventListener("click", (e) => {
  const el = e.target, act = el.closest("[data-act]")?.dataset.act;
  if (!el.closest(".avatar-wrap")) $("#menu").classList.remove("open");
  if (el.closest("#avatarBtn")) { $("#menu").classList.toggle("open"); return; }
  const g = el.closest("[data-go]"); if (g) { go({ kind: g.dataset.go }); return; }
  const cs = el.closest("[data-course]"); if (cs) { courseTab = "a"; go({ kind: "course", code: cs.dataset.course }); return; }
  const wv = el.closest("[data-wv]"); if (wv) { weekView = wv.dataset.wv; render(); return; }
  const tb = el.closest("[data-tab]"); if (tb) { courseTab = tb.dataset.tab; render(); return; }
  const as = el.closest("[data-assess]"); if (as) { openCite = null; openAssess(as.dataset.assess); return; }
  const ci = el.closest("[data-cite]"); if (ci) { openCite = openCite === ci.dataset.cite ? null : ci.dataset.cite; drawerFor ? openAssess(drawerFor) : render(); return; }
  const pl = el.closest("[data-plan]"); if (pl) { openPlan(+pl.dataset.plan); return; }
  const cv = el.closest("[data-conv]"); if (cv) { current = cv.dataset.conv; render(); return; }
  const pn = el.closest("[data-panel]"); if (pn) { $("#menu").classList.remove("open"); openPanel(pn.dataset.panel); return; }
  const th = el.closest("[data-theme-opt]"); if (th) { settings.theme = th.dataset.themeOpt; store.set("theme", settings.theme); applyTheme(); openPanel("mSettings"); return; }
  const lg = el.closest("[data-lang]"); if (lg) { settings.lang = lg.dataset.lang; store.set("lang", settings.lang); applyLang(); render(); openPanel("mSettings"); return; }
  if (el.closest("[data-close]") || el.id === "scrim") { closeLayers(); return; }
  if (el.closest("#syncBtn")) { const b = $("#syncBtn"); b.textContent = t("syncing"); b.disabled = true; setTimeout(() => { b.textContent = t("sync"); b.disabled = false; }, 1200); return; }
  if (act === "open-quiz") { current = "quiz11"; go({ kind: "agent" }); return; }
  if (act === "status") { openPanel("mStatus"); return; }
  if (act === "add-ext") { openAddExt(); return; }
  if (act === "confirm") { const c = courseOf(page.code); c.confirm = !c.confirm; render(); return; }
  if (act === "new-chat") { convs.unshift({ id: "c" + Date.now(), title: settings.lang === "en" ? "New chat" : "新对话", when: hhmm(new Date()), msgs: [] }); current = convs[0].id; render(); return; }
  if (act === "submit" || act === "cancel") {
    runState = act === "submit" ? "submitted" : "cancelled";
    if (act === "submit") { audit[0] = ["10/15 " + hhmm(new Date()), "Weekly quiz 11", "填写并提交", "前端确认"]; plan.find((p) => p.waiting).done = true; }
    convs.find((c) => c.id === "quiz11").msgs.push({ who: "ag", text: t(act === "submit" ? "submitted" : "cancelled") }); render(); return;
  }
  if (act === "review-all" || act === "review-wrong") {
    const c = courseOf(page.code), wrong = act === "review-wrong";
    startConv("rev-" + c.code + (wrong ? "-w" : ""), `${c.code} · ${t("tabR")}${wrong ? " · " + t("wrong") : ""}`, reviewPrompt(c, wrong),
      wrong ? "你之前错了 3 题，先从第 1 题开始：Observer 和 Strategy 的关键区别是什么？（出处：W3 讲义 p.12）"
            : "重点有三块：设计模式（W3–4）、领域模型（W5）、并发与事务（W8–9）。先考你第 1 题：Observer 和 Strategy 都把变化的部分抽出去，二者的关键区别是什么？（出处：W3 讲义 p.12）");
    return;
  }
  if (act === "ask") {
    const c = courseOf(page.code), a = c.assess.find((x) => x.id === drawerFor);
    startConv("do-" + c.code + a.id, `${c.code} · ${a.n}`, settings.lang === "en" ? `Do ${c.code} · ${a.n} for me. Check my level first, show each step, and wait for me before submitting.` : `帮我完成 ${c.code} · ${a.n}。先检查授权等级，每一步显示出来，提交前等我确认。`,
      `授权检查：${c.code} · ${a.n} 是 L${a.lv ?? c.level}，可以做。我先打开题目页面，读完要求后告诉你计划。`);
  }
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.matches("[data-deflv]")) { courseOf(page.code).level = +el.value; render(); return; }
  if (el.matches("[data-lv]")) { const a = courseOf(page.code).assess.find((x) => x.id === el.dataset.lv); a.lv = el.value === "" ? undefined : +el.value; render(); openAssess(a.id); return; }
  if (el.matches("[data-band]")) { band = el.value; render(); return; }
  if (el.closest("#availForm")) { const f = new FormData($("#availForm")); for (let i = 0; i < 7; i++) avail[i] = Number(f.get("d" + i)) || 0; store.set("avail", avail); render(); }
});
document.addEventListener("submit", (e) => {
  e.preventDefault(); const f = new FormData(e.target);
  if (e.target.id === "chatForm") { const q = $("#chatText").value.trim(); if (!q) return; const cv = convs.find((c) => c.id === current); cv.msgs.push({ who: "me", text: q }); agentSay(cv, settings.lang === "en" ? "Got it. (Prototype: sample reply.)" : "收到。（原型：示例回复）"); return; }
  if (e.target.id === "extForm") { const d = Number(f.get("due").split("-")[2]); plan.push({ d: d >= 12 && d <= 18 ? d : 17, at: f.get("at") || undefined, title: f.get("title"), ext: true, h: Number(f.get("h")) || 1 }); closeLayers(); render(); return; }
  if (e.target.id === "actForm") { const p = plan[+e.target.dataset.i]; p.act = f.get("act") === "" ? undefined : Number(f.get("act")); p.done = p.act != null || p.done; closeLayers(); render(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeLayers(); $("#menu").classList.remove("open"); } });

applyTheme(); applyLang(); render();
</script>
</body>
</html>
